<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Out of scope</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 24px;
        font: 16px/1.5 -apple-system, sans-serif;
      }
      a {
        display: block;
        margin: 12px 0;
        padding: 14px;
        border-radius: 8px;
        background: #06c;
        color: #fff;
        text-align: center;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>Out of scope</h1>
    <p>
      This page is outside the web app's scope, like an identity provider's sign-in page. It
      returns to the app in 3 seconds, as an OAuth redirect would.
    </p>
    <a href="../app/?back=1">Return now</a>
    <script>
      setTimeout(function () {
        location.replace('../app/?back=1');
      }, 3000);
    </script>
  </body>
</html>
